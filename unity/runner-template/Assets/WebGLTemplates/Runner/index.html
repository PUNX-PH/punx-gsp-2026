<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1016; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #0e1016; outline: none; }
      #unity-loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; color: #c8ccd8; font-size: 14px; letter-spacing: 0.04em; background: #0e1016; }
      #unity-bar { width: 168px; height: 4px; border-radius: 2px; background: #232734; overflow: hidden; }
      #unity-bar-fill { width: 4%; height: 100%; border-radius: 2px; background: #ff6b5a; transition: width 0.25s ease; }
      #unity-message { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); max-width: 80%; padding: 10px 16px; border-radius: 10px; background: #3a1a1c; color: #ffd9d6; font-size: 14px; display: none; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading">
      <span>Loading</span>
      <div id="unity-bar"><div id="unity-bar-fill"></div></div>
    </div>
    <div id="unity-message"></div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var message = document.querySelector("#unity-message");

      // Warnings are quiet (they only matter to the developer log); an error stays on screen.
      function unityShowBanner(msg, type) {
        if (type !== "error") return;
        message.textContent = msg.replace(/<[^>]*>/g, "");
        message.style.display = "block";
      }

      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
      };

      var script = document.createElement("script");
      script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#unity-bar-fill").style.width = Math.max(4, 100 * progress) + "%";
        }).then(function () {
          document.querySelector("#unity-loading").style.display = "none";
        }).catch(function (error) {
          document.querySelector("#unity-loading").style.display = "none";
          unityShowBanner(String(error), "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
